<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Sudan PR Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="css">/* Layout: control-room register — sticky command bar, KPI strip (clickable filters), three charts, tabbed workspace, slide-in PR editor */
:root {
  --bg: #eef0ec; --panel: #ffffff; --panel-2: #f7f8f5; --ink: #1b2220; --muted: #5b6561; --line: #d6dbd5; --track: #e4e8e2;
  --accent: #1f5f73; --accent-ink: #ffffff; --ok: #2f7a4b; --warn: #a35f08; --bad: #b3261e; --neutral: #8a948f;
  --bad-bg: #fbeceb; --warn-bg: #fbf1e3; --ok-bg: #e8f3ec; --acc-bg: #e5f0f3;
  --shadow: 0 10px 30px rgba(20, 30, 28, .18);
  --f-display: "IBM Plex Serif", Georgia, serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121715; --panel: #1a201e; --panel-2: #202724; --ink: #e5ebe8; --muted: #9aa5a0; --line: #2e3734; --track: #2a3230;
  --accent: #6db3c9; --accent-ink: #0e1a1e; --ok: #6cc08c; --warn: #e3a24a; --bad: #f07a70; --neutral: #74807b;
  --bad-bg: #3a1f1d; --warn-bg: #3a2c17; --ok-bg: #1b3325; --acc-bg: #18303a; --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121715; --panel: #1a201e; --panel-2: #202724; --ink: #e5ebe8; --muted: #9aa5a0; --line: #2e3734; --track: #2a3230;
  --accent: #6db3c9; --accent-ink: #0e1a1e; --ok: #6cc08c; --warn: #e3a24a; --bad: #f07a70; --neutral: #74807b;
  --bad-bg: #3a1f1d; --warn-bg: #3a2c17; --ok-bg: #1b3325; --acc-bg: #18303a; --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1400px; margin-inline: auto; }

/* command bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar .inner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand .eb { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 22px; line-height: 1.15; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--neutral); }
.sync.live i { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
.sync.err i { background: var(--bad); }
.me { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.me img { width: 22px; height: 22px; border-radius: 50%; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 3px 9px; font-size: 12px; }

main.inner { display: flex; flex-direction: column; gap: 18px; padding-block: 18px 60px; font-variant-numeric: tabular-nums; }
.take { margin: 0; font-size: 15px; max-width: 110ch; }
.take b { font-weight: 600; } .take b.bad { color: var(--bad); }
.src { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.banner { border: 1px solid var(--line); background: var(--panel); border-left: 4px solid var(--warn); border-radius: 6px; padding: 10px 14px; font-size: 13px; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.kpi { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; min-width: 0; position: relative; }
.kpi:hover { border-color: var(--accent); }
.kpi[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--acc-bg); }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .n { font-family: var(--f-display); font-size: 30px; line-height: 1.1; font-weight: 500; }
.kpi .s { font-size: 11px; color: var(--muted); }
.kpi.bad .n { color: var(--bad); } .kpi.warn .n { color: var(--warn); } .kpi.ok .n { color: var(--ok); }

/* charts */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h2 { margin: 0; font-size: 14px; font-weight: 600; }
.note { margin: 0; font-size: 12px; color: var(--muted); }
.chart { position: relative; min-height: 110px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--f-body); }
.chart .hit { cursor: pointer; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 6px 10px; font-size: 12px; white-space: nowrap; z-index: 3; }
.tip .k { color: var(--muted); }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 9px 14px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .cnt { font-family: var(--f-mono); font-size: 11px; background: var(--track); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
.pane { display: flex; flex-direction: column; gap: 10px; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters input[type=search] { flex: 1 1 220px; max-width: 340px; min-width: 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.filters select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 13px; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipf { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; background: var(--acc-bg); color: var(--ink); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 4px 2px 10px; }
.chipf button { border: 0; background: none; cursor: pointer; padding: 0 6px; font-size: 14px; line-height: 1; color: var(--muted); }
.count { font-size: 12px; color: var(--muted); margin-left: auto; }

/* table */
.tbl-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; z-index: 2; background: var(--panel-2); text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th button { all: unset; cursor: pointer; }
th[aria-sort="ascending"] button::after { content: " ▲"; font-size: 9px; }
th[aria-sort="descending"] button::after { content: " ▼"; font-size: 9px; }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--panel-2); }
tbody tr.sel td { background: var(--acc-bg); }
td.stripe { padding: 0; width: 4px; }
tr.r-CRITICAL td.stripe { background: var(--bad); } tr.r-HIGH td.stripe { background: var(--warn); } tr.r-MEDIUM td.stripe { background: var(--accent); }
.num { text-align: right; white-space: nowrap; }
.mono { font-family: var(--f-mono); }
td.key { font-family: var(--f-mono); font-weight: 500; white-space: nowrap; }
td.dim, span.dim { color: var(--muted); font-style: italic; }
td.wrap { min-width: 180px; max-width: 320px; }
td.nowrap { white-space: nowrap; }
.inl { border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 3px 4px; font-size: 12px; font-weight: 600; cursor: pointer; max-width: 140px; }
.inl:hover, .inl:focus { border-color: var(--line); background: var(--panel); }
.inl[disabled] { cursor: default; }
.st-OPEN { color: var(--accent); } .st-CLOSE { color: var(--ok); } .st-NOT { color: var(--muted); }
.p-HIGH { color: var(--bad); } .p-MEDIUM { color: var(--accent); } .p-LOW { color: var(--muted); }
.chip { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .02em; border: 1px solid currentColor; white-space: nowrap; }
.rk-CRITICAL { color: var(--bad); background: var(--bad-bg); } .rk-HIGH { color: var(--warn); background: var(--warn-bg); } .rk-MEDIUM { color: var(--accent); } .rk-LOW { color: var(--muted); } .rk-- { color: var(--muted); border-color: transparent; }
.cat-comp { color: var(--bad); } .cat-stat { color: var(--warn); } .cat-fol { color: var(--accent); } .cat-data { color: var(--muted); }
.pbar { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.pbar i { display: block; width: 52px; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; flex: none; }
.pbar i s { display: block; height: 100%; background: var(--accent); text-decoration: none; }
.pbar.full i s { background: var(--ok); }
.pbar select { width: 66px; text-align: right; }
.exflag { display: inline-flex; min-width: 20px; justify-content: center; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 6px; background: var(--warn-bg); color: var(--warn); }
.exflag.c { background: var(--bad-bg); color: var(--bad); }
.empty { padding: 30px; text-align: center; color: var(--muted); }

/* exceptions groups */
.xgroups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.xg { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.xg[aria-pressed="true"] { border-color: var(--accent); background: var(--acc-bg); }
.xg b { font-family: var(--f-display); font-size: 24px; font-weight: 500; display: block; }
.xg span { font-size: 12px; color: var(--muted); }

/* activity */
.log { display: flex; flex-direction: column; }
.log .ev { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.log .ev img { width: 26px; height: 26px; border-radius: 50%; }
.log .who { font-size: 13px; } .log .who b { font-weight: 600; }
.log .when { font-size: 12px; color: var(--muted); }
.log ul { margin: 4px 0 0; padding-left: 16px; font-size: 12px; }
.log .pr { font-family: var(--f-mono); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); }

ul.notes { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; max-width: 110ch; }
.mtable td, .mtable th { position: static; font-size: 12px; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 14, .35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); z-index: 41; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slidein .18s ease-out; } @keyframes slidein { from { transform: translateX(30px); opacity: .4; } } }
.dh { display: flex; align-items: flex-start; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dh h3 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 22px; }
.dh .sub { font-size: 12px; color: var(--muted); }
.dh .x { margin-left: auto; }
.db { flex: 1; overflow: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 16px; }
.df { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.df .sp { flex: 1; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
legend { font-size: 11px; font-family: var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; padding: 0; }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld.full { grid-column: 1 / -1; }
.fld label { font-size: 12px; color: var(--muted); }
.fld input, .fld select, .fld textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 13px; }
.fld textarea { min-height: 60px; resize: vertical; }
.fld.chg input, .fld.chg select, .fld.chg textarea { border-color: var(--accent); background: var(--acc-bg); }
.pctrow { display: flex; align-items: center; gap: 8px; } .pctrow input[type=range] { flex: 1; padding: 0; border: 0; background: none; } .pctrow input[type=number] { width: 70px; }
.calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.calc div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.calc span { display: block; font-size: 11px; color: var(--muted); }
.calc b { font-size: 15px; font-weight: 600; }
.dx { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.dx li { font-size: 12px; border-left: 3px solid var(--warn); padding: 4px 8px; background: var(--warn-bg); border-radius: 0 4px 4px 0; }
.dx li.c { border-color: var(--bad); background: var(--bad-bg); }
.dx li.ok { border-color: var(--ok); background: var(--ok-bg); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 12px 9px 16px; border-radius: 8px; font-size: 13px; z-index: 60; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 5px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
.toast.err { background: var(--bad); color: #fff; }

@media (max-width: 640px) { fieldset { grid-template-columns: 1fr; } .brand h1 { font-size: 19px; } .hide-sm { display: none; } }

/* save bar + read-only chip */
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--ink); color: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -6px 20px rgba(0,0,0,.18); }
.savebar .inner { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.savebar #sb-text { font-weight: 600; }
.savebar .sb-hint { font-size: 12px; opacity: .75; margin-right: auto; }
.savebar .sb-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
.savebar .btn { background: transparent; color: inherit; border-color: currentColor; }
.savebar .btn.primary { background: var(--bg); color: var(--ink); border-color: var(--bg); }
body.has-savebar main.inner { padding-bottom: 110px; }
.ro { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.log .ev.pending .when { color: var(--warn); font-weight: 600; }
.toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
</style>
<template id="shell"><header class="bar gut">
  <div class="inner">
    <div class="brand">
      <span class="eb">UK-Med Sudan · Tawila / MERU · Procurement</span>
      <h1>Sudan PR Tracker</h1>
    </div>
    <span class="sync" id="sync"><i></i><span>Connecting…</span></span>
    <span class="me" id="me"></span>
    <button class="btn" id="b-html" type="button" hidden>Download web page</button>
    <button class="btn" id="b-export" type="button" hidden>Export CSV</button>
    <button class="btn primary" id="b-new" type="button" hidden>+ New PR</button>
  </div>
</header>

<main class="inner gut">
  <div id="banner" class="banner" hidden></div>
  <div>
    <p class="take" id="take">Loading the register…</p>
    <p class="src" id="src">Source: PR Register sheet of MR Follow up Dashboard 4.xls. Days open, aging and risk flag use the workbook's own formulas, calculated to today.</p>
  </div>

  <section class="kpis" id="kpis" aria-label="Headline figures (click to filter)"></section>

  <section class="charts">
    <div class="card"><h2>PR lines by stage</h2><p class="note">Click a bar to filter the register.</p><div class="chart" id="c-stage"></div></div>
    <div class="card"><h2>Open PRs by aging band</h2><p class="note">Days open = today − open date (workbook formula).</p><div class="chart" id="c-aging"></div></div>
    <div class="card"><h2>Open PRs by priority and risk</h2><p class="note">Risk flag from priority and % complete (workbook formula).</p><div class="chart" id="c-prio"></div></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-reg" aria-selected="true" data-p="reg">Register <span class="cnt" id="n-reg">0</span></button>
    <button class="tab" role="tab" id="t-exc" aria-selected="false" data-p="exc">Exceptions <span class="cnt" id="n-exc">0</span></button>
    <button class="tab" role="tab" id="t-log" aria-selected="false" data-p="log">Activity log</button>
    <button class="tab" role="tab" id="t-met" aria-selected="false" data-p="met">Method &amp; notes</button>
  </nav>

  <section class="pane" id="p-reg">
    <div class="filters">
      <input type="search" id="f-q" placeholder="Search PR, item, remark, supplier…" aria-label="Search">
      <select id="f-stage" aria-label="Stage"><option value="">All stages</option><option>OPEN</option><option>CLOSE</option><option>NOT INITIATED</option></select>
      <select id="f-priority" aria-label="Priority"><option value="">All priorities</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select>
      <select id="f-risk" aria-label="Risk"><option value="">All risk flags</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select>
      <select id="f-family" aria-label="Family"><option value="">All families</option></select>
      <button class="btn sm" id="f-clear" type="button">Clear filters</button>
      <span class="count" id="f-count"></span>
    </div>
    <div class="chips" id="f-chips"></div>
    <div class="tbl-wrap">
      <table id="reg">
        <thead><tr>
          <th></th>
          <th><button type="button" data-k="n">PR</button></th>
          <th><button type="button" data-k="item">Item</button></th>
          <th class="hide-sm"><button type="button" data-k="family">Family</button></th>
          <th><button type="button" data-k="stage">Stage</button></th>
          <th><button type="button" data-k="prio_rank">Priority</button></th>
          <th><button type="button" data-k="risk_rank">Risk</button></th>
          <th class="num"><button type="button" data-k="pct">% complete</button></th>
          <th class="num"><button type="button" data-k="days">Days</button></th>
          <th class="hide-sm"><button type="button" data-k="aging">Aging</button></th>
          <th><button type="button" data-k="remarks">Remarks / missing</button></th>
          <th class="hide-sm"><button type="button" data-k="next_action">Next action</button></th>
          <th class="hide-sm"><button type="button" data-k="action_due">Due</button></th>
          <th class="num"><button type="button" data-k="nexc">Flags</button></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>

<script id="core">/* ===== CORE (pure functions, no DOM) ===== */
const CORE = (() => {
  const TIERS = [
    { t: 1, max: 500, method: 'Invoice only', quotes: 'Not required' },
    { t: 2, max: 2500, method: 'PO + invoice', quotes: '1 written quote' },
    { t: 3, max: 25000, method: 'Basic 3-quote', quotes: '3 written quotes' },
    { t: 4, max: 100000, method: 'Enhanced 3-quote', quotes: '3 written quotes' },
    { t: 5, max: Infinity, method: 'Tender', quotes: 'Tender' },
  ];
  const RISK_RANK = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3, '-': 9 };
  const PRIO_RANK = { HIGH: 0, MEDIUM: 1, LOW: 2 };
  const dayNum = (s) => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
  const isNum = (v) => typeof v === 'number' && isFinite(v);
  function derive(r, today) {
    const pct = isNum(r.pct) ? r.pct : 0;
    let days = null;
    if (r.stage === 'CLOSE') { if (r.open_date && r.closure_date) days = dayNum(r.closure_date) - dayNum(r.open_date); }
    else if (r.open_date) days = dayNum(today) - dayNum(r.open_date);
    const aging = days == null ? '-' : days <= 7 ? '0-7d' : days <= 15 ? '8-15d' : days <= 30 ? '16-30d' : '>30d';
    let risk = '-';
    if (r.stage !== 'CLOSE' && r.stage !== 'NOT INITIATED') {
      if (r.priority === 'HIGH' && pct < 0.5) risk = 'CRITICAL';
      else if (r.priority === 'HIGH' && pct < 1) risk = 'HIGH';
      else if (pct < 0.5) risk = 'MEDIUM';
      else risk = 'LOW';
    }
    const gbp = isNum(r.value_gbp) ? r.value_gbp : (isNum(r.est_value) && String(r.currency || '').toUpperCase() === 'GBP' ? r.est_value : null);
    const tier = gbp == null ? null : TIERS.find((x) => gbp <= x.max);
    return { ...r, pct, days, aging, risk, gbp, tier: tier ? tier.t : null, tierInfo: tier || null,
      risk_rank: RISK_RANK[risk] ?? 9, prio_rank: PRIO_RANK[r.priority] ?? 9 };
  }
  function exceptions(rows, today) {
    const out = [];
    const add = (r, category, check, evidence) => out.push({ pr: r.pr, category, check, evidence });
    for (const r of rows) {
      const rem = r.remarks || '';
      const init = r.stage === 'OPEN' || r.stage === 'CLOSE';
      if (r.stage === 'CLOSE' && /GRN/i.test(rem)) add(r, 'Close-out compliance', 'Closed with GRN missing', 'Stage CLOSE; remark "' + rem + '"');
      if (r.stage === 'CLOSE' && /pa(id|yment)/i.test(rem)) add(r, 'Close-out compliance', 'Closed with payment outstanding', 'Stage CLOSE; remark "' + rem + '"');
      if (r.stage === 'CLOSE' && r.tier != null && r.tier >= 2 && !r.po_ref) add(r, 'Close-out compliance', 'Closed without PO reference (Tier ' + r.tier + ')', 'Value £' + r.gbp.toLocaleString('en-GB') + '; PO reference blank');
      if (r.stage === 'CLOSE' && r.pct < 1) add(r, 'Status', 'Closed below 100% complete', 'Stage CLOSE; % complete ' + Math.round(r.pct * 100) + '%');
      if (r.stage === 'CLOSE' && /cancel/i.test(rem)) add(r, 'Status', 'Cancelled PR recorded as closed', 'Stage CLOSE; remark "' + rem + '"');
      if (r.stage === 'NOT INITIATED' && /cancel/i.test(rem)) add(r, 'Status', 'Cancelled PR not closed', 'Stage NOT INITIATED; remark "' + rem + '"' + (r.next_action ? '; next action "' + r.next_action + '"' : ''));
      if (r.stage === 'OPEN' && r.pct === 1) add(r, 'Status', 'Open at 100% complete', 'Stage OPEN; % complete 100%' + (rem ? '; remark "' + rem + '"' : ''));
      if (r.stage === 'OPEN' && r.closure_date) add(r, 'Status', 'Open with closure date recorded', 'Stage OPEN; closure date ' + r.closure_date);
      if (r.stage === 'OPEN' && r.action_due && r.action_due < today) add(r, 'Follow-up', 'Next action overdue', 'Due ' + r.action_due + (r.next_action ? '; "' + r.next_action + '"' : ''));
      if (r.stage === 'CLOSE' && !r.closure_date) add(r, 'Data quality', 'Closed without closure date', 'Stage CLOSE; closure date blank' + (r.open_date ? '' : '; open date blank'));
      if (r.open_date && r.closure_date && r.open_date > r.closure_date) add(r, 'Data quality', 'Open date after closure date', 'Opened ' + r.open_date + '; closed ' + r.closure_date);
      if (r.open_date && r.open_date > today) add(r, 'Data quality', 'Open date in the future', 'Opened ' + r.open_date + '; today ' + today);
      if (init && !rem) add(r, 'Data quality', 'No remarks on initiated PR', 'Stage ' + r.stage + '; remarks blank');
      if (isNum(r.est_value) && !r.currency) add(r, 'Data quality', 'Value without currency', 'Value ' + r.est_value + '; currency blank');
      if (isNum(r.est_value) && r.currency && String(r.currency).toUpperCase() !== 'GBP' && !isNum(r.value_gbp)) add(r, 'Data quality', 'No GBP equivalent: tier cannot be set', 'Value ' + r.est_value + ' ' + r.currency + '; GBP equivalent blank');
    }
    const ord = { 'Close-out compliance': 0, Status: 1, 'Follow-up': 2, 'Data quality': 3 };
    return out.sort((a, b) => ord[a.category] - ord[b.category] || a.check.localeCompare(b.check) || a.pr.localeCompare(b.pr));
  }
  function kpis(rows, exc, today) {
    const init = rows.filter((r) => r.stage === 'OPEN' || r.stage === 'CLOSE');
    const open = rows.filter((r) => r.stage === 'OPEN');
    const avg = (a) => a.length ? Math.round(a.reduce((s, r) => s + r.pct, 0) / a.length * 1000) / 10 : null;
    const rc = (f) => open.filter((r) => r.risk === f).length;
    return {
      total: rows.length, initiated: init.length, open: open.length,
      closed: rows.filter((r) => r.stage === 'CLOSE').length,
      not_initiated: rows.filter((r) => r.stage === 'NOT INITIATED').length,
      avg_init: avg(init), avg_open: avg(open),
      critical: rc('CRITICAL'), high: rc('HIGH'), medium: rc('MEDIUM'),
      open_high_prio: open.filter((r) => r.priority === 'HIGH').length,
      no_next: open.filter((r) => !r.next_action).length,
      overdue: open.filter((r) => r.action_due && r.action_due < today).length,
      exceptions: exc.length, exc_prs: new Set(exc.map((e) => e.pr)).size,
      comp_prs: new Set(exc.filter((e) => e.category === 'Close-out compliance').map((e) => e.pr)).size,
    };
  }
  return { derive, exceptions, kpis, TIERS };
})();

  $('#b-export').onclick = async () => {
    const cols = ['n', 'pr', 'family', 'item', 'priority', 'validated', 'stage', 'open_date', 'closure_date', 'pct', 'days', 'aging', 'risk', 'responsible', 'next_action', 'action_due', 'remarks', 'est_value', 'currency', 'value_gbp', 'tier', 'supplier', 'po_ref', 'grn_ref', 'invoice_ref', 'nexc'];
    const head = ['N', 'PR N.', 'FAMILY', 'ITEM', 'PRIORITY', 'VALIDATED', 'STAGE', 'OPEN DATE', 'CLOSURE DATE', '% COMPLETE', 'DAYS', 'AGING', 'RISK FLAG', 'RESPONSIBLE', 'NEXT ACTION', 'ACTION DUE', 'REMARKS', 'EST. VALUE', 'CURRENCY', 'VALUE GBP', 'TIER', 'SUPPLIER', 'PO REF', 'GRN REF', 'INVOICE REF', 'EXCEPTIONS'];
    const esc = (v) => { if (v == null) return ''; const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const rows = state.rows.slice().sort((a, b) => a.n - b.n).map((r) => cols.map((c) => esc(c === 'pct' ? Math.round(r.pct * 1000) / 10 + '%' : c === 'risk' && r.risk === '-' ? '' : c === 'aging' && r.aging === '-' ? '' : r[c])).join(','));
    const exc = ['', 'EXCEPTIONS', 'PR,CATEGORY,CHECK,EVIDENCE', ...state.exc.map((e) => [e.pr, e.category, e.check, e.evidence].map(esc).join(','))];
    try { await saveFile('Sudan_PR_Register_' + todayStr() + '.csv', '\ufeff' + [head.join(','), ...rows, ...exc].join('\r\n'), 'text/csv'); toast('Export saved'); }
    catch (e) { if (e && e.code !== 'declined') toast('Export is not available here.', { err: true }); }
  };
  $('#b-html').onclick = async () => {
    const snap = { ...BASE };
    if (state.pending.length) toast('The downloaded page contains saved data only. Save first to include your unsaved changes.');
    try { await saveFile('Sudan_PR_Tracker_' + todayStr() + '.html', buildDocument(snap, true), 'text/html'); toast('Web page saved. It opens in any browser.'); }
    catch (e) { if (e && e.code !== 'declined') toast('Download is not available here.', { err: true }); }
  };

  /* ---------- start ---------- */
  setSync(C ? 'live' : '', state.canWrite ? 'Editing' : 'Published data');
  if (!C) setSync('live', 'Web version');
  if (restoredNote && !OFFLINE) { const b = $('#banner'); b.hidden = false; b.textContent = restoredNote; }
  renderSource(); recompute(); syncFilterInputs(); showTab(state.tab); render();
  if (OFFLINE && state.canWrite) enterOfflineEdit();
})();
</script></body></html>
